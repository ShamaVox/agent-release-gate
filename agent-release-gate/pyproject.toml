[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldengate"
version = "1.0.0"
description = "A release gate for AI agents: golden sets, truth checks and baseline comparison."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shama Keskar" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
goldengate = "goldengate.cli:main"

[tool.setuptools]
packages = ["goldengate"]
